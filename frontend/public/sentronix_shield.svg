<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <!-- Neon Shield Border Gradient (Purple Team: Red/Purple/Blue) -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Core S Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shield Outer Glow -->
  <path d="M256 42 L424 104 C424 286 338 418 256 468 C174 418 88 286 88 104 Z"
        fill="none" stroke="#8B5CF6" stroke-width="18" opacity="0.4" filter="url(#glow)"/>

  <!-- Shield Base Body -->
  <path d="M256 46 L420 106 C420 282 336 412 256 462 C176 412 92 282 92 106 Z"
        fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner Subtle Shield Inset -->
  <path d="M256 78 L390 128 C390 270 322 376 256 420 C190 376 122 270 122 128 Z"
        fill="#111827" fill-opacity="0.6" stroke="#4C1D95" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- High-Tech Cyber Grid Accent -->
  <line x1="256" y1="90" x2="256" y2="415" stroke="#7C3AED" stroke-width="3" stroke-opacity="0.4"/>
  <line x1="160" y1="230" x2="352" y2="230" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Central Stylized Bold Geometric "S" Monogram -->
  <!-- Top Segment -->
  <path d="M342 166 L224 166 C198 166 182 182 182 208 C182 234 198 250 224 250 L288 250 C314 250 330 266 330 292 C330 318 314 334 288 334 L170 334"
        fill="none" stroke="url(#coreGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circuit Nodes on S -->
  <circle cx="342" cy="166" r="10" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="170" cy="334" r="10" fill="#EF4444" filter="url(#glow)"/>
  <circle cx="256" cy="250" r="12" fill="#A855F7" filter="url(#glow)"/>
  <circle cx="256" cy="250" r="6" fill="#FFFFFF"/>
</svg>