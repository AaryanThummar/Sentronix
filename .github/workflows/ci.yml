name: CI Pipeline (Lint + Test Gate)

on:
  push:
    branches: [ main, develop, "v2/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Lint Check
        run: |
          python -m compileall app/

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend (Vite)
        run: npm run build

  discord-notification:
    name: Discord CI/CD Notification
    needs: [backend-ci, frontend-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Webhook Alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping notification."
            exit 0
          fi

          STATUS="${{ needs.backend-ci.result == 'success' && needs.frontend-ci.result == 'success' && 'SUCCESS' || 'FAILURE' }}"
          COLOR=$([ "$STATUS" = "SUCCESS" ] && echo 3066993 || echo 15158332)
          EMOJI=$([ "$STATUS" = "SUCCESS" ] && echo "✅" || echo "❌")

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "$EMOJI SentroniX CI Pipeline: $STATUS",
                "description": "**Commit:** \`${{ github.sha }}\`\n**Branch:** \`${{ github.ref_name }}\`\n**Author:** ${{ github.actor }}\n**Event:** \`${{ github.event_name }}\`",
                "color": $COLOR,
                "fields": [
                  {
                    "name": "Backend Test & Lint",
                    "value": "${{ needs.backend-ci.result }}",
                    "inline": true
                  },
                  {
                    "name": "Frontend Build",
                    "value": "${{ needs.frontend-ci.result }}",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "SentroniX Automated Purple Team CI/CD | KAN-23"
                },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
