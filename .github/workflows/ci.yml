name: CI Pipeline (Lint + Test Gate)

on:
  push:
    branches: [ main, develop, "v2/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Lint Check
        run: |
          python -m compileall app/

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend (Vite)
        run: npm run build

  notify:
    name: Discord Notification
    needs: [backend-ci, frontend-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on failure
        if: needs.backend-ci.result == 'failure' || needs.frontend-ci.result == 'failure'
        run: |
          if [ -n "${{ secrets.DISCORD_CICD_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" -X POST -d '{"content": "❌ CI failed on ${{ github.ref_name }} — ${{ github.actor }} — ${{ github.event.head_commit.message }}"}' ${{ secrets.DISCORD_CICD_WEBHOOK }}
          fi

      - name: Notify Discord on success
        if: needs.backend-ci.result == 'success' && needs.frontend-ci.result == 'success'
        run: |
          if [ -n "${{ secrets.DISCORD_CICD_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" -X POST -d '{"content": "✅ CI passed on ${{ github.ref_name }}"}' ${{ secrets.DISCORD_CICD_WEBHOOK }}
          fi
